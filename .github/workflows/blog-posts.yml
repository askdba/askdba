name: Update blog posts

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-posts
  cancel-in-progress: false

jobs:
  update-readme:
    name: Refresh "Recently on the blog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://askdba.net/feed/"
          max_post_count: 5
          commit_message: "Update recent blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
